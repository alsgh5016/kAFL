- name: Clone repo
  ansible.builtin.git:
    repo: "{{ libxdc_url }}"
    dest: "{{ libxdc_root }}"
    version: "{{ libxdc_revision | default(omit) }}"
    depth: "{{ git_clone_depth | default(omit) }}"
    force: "{{ force_clone }}"
  tags:
    - clone

- name: Build libxdc
  ansible.builtin.shell: make -j$(nproc)
  args:
    chdir: "{{ libxdc_root }}"
  environment:
    CAPSTONE_ROOT: "{{ capstone_root }}"
  when: not ansible_check_mode
  tags:
    - build
